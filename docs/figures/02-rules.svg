<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <rect width="1200" height="590" fill="#ffffff"/>

  <text x="600" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">設定ゼロで効いているもの —— 既定のルールセット「Sonar way」</text>
  <text x="600" y="86" text-anchor="middle" font-size="17" fill="#6b7280">SonarQube for IDE の Python アナライザに同梱されているルール 435 個の内訳</text>

  <!-- OFF callout -->
  <text x="1120" y="140" text-anchor="end" font-size="17" font-weight="700" fill="#b45309">既定で OFF ： 37 ルール</text>
  <line x1="1075" y1="152" x2="1075" y2="178" stroke="#d97706" stroke-width="2"/>

  <!-- stacked bar -->
  <path d="M80 180 h941 v64 h-941 a10 10 0 0 1 -10 -10 v-44 a10 10 0 0 1 10 -10 z" fill="#16a34a"/>
  <path d="M1021 180 h89 a10 10 0 0 1 10 10 v44 a10 10 0 0 1 -10 10 h-89 z" fill="#f59e0b"/>
  <line x1="1021" y1="180" x2="1021" y2="244" stroke="#ffffff" stroke-width="2"/>

  <text x="104" y="212" font-size="20" font-weight="800" fill="#ffffff">既定で ON ： 398 ルール</text>
  <text x="104" y="234" font-size="14" fill="#d9f5e2">＝ 拡張機能を入れた瞬間から効いているもの（Sonar way）</text>

  <text x="80" y="278" font-size="15" fill="#6b7280">どのプロジェクトでも文句なく有効にできる、と Sonar が判断したルールだけが入っている</text>

  <!-- connector: elbow from the OFF segment down to the two cards -->
  <text x="80" y="318" font-size="15" font-weight="700" fill="#b45309">OFF の例：直すべきかがチームによって変わるルール</text>
  <g fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 5">
    <path d="M1075 252 V 342 H 380"/>
    <path d="M380 342 V 356"/>
    <path d="M820 342 V 356"/>
  </g>

  <!-- card A -->
  <rect x="170" y="356" width="420" height="150" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
  <rect x="192" y="376" width="46" height="24" rx="12" fill="#d97706"/>
  <text x="215" y="393" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">OFF</text>
  <text x="250" y="394" font-size="15" font-weight="700" fill="#92400e" font-family="'SFMono-Regular',Menlo,Consolas,monospace">python:S5042</text>
  <text x="192" y="430" font-size="18" font-weight="700" fill="#111827">ZIP の無制限展開（Zip Bomb）</text>
  <text x="192" y="458" font-size="13" fill="#6b7280">数十 KB の ZIP が展開後に数十 GB へ膨らむ細工が可能。</text>
  <text x="192" y="480" font-size="13" fill="#6b7280">ただし社内の信頼できるファイルしか扱わないなら</text>
  <text x="192" y="498" font-size="13" fill="#6b7280">「過剰」という判断もありえる。</text>

  <!-- card B -->
  <rect x="610" y="356" width="420" height="150" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
  <rect x="632" y="376" width="46" height="24" rx="12" fill="#d97706"/>
  <text x="655" y="393" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">OFF</text>
  <text x="690" y="394" font-size="15" font-weight="700" fill="#92400e" font-family="'SFMono-Regular',Menlo,Consolas,monospace">python:S134</text>
  <text x="632" y="430" font-size="18" font-weight="700" fill="#111827">制御構文のネストが深すぎる</text>
  <text x="632" y="458" font-size="13" fill="#6b7280">何段まで許すかはチームの好み次第。</text>
  <text x="632" y="480" font-size="13" fill="#6b7280">既定の上限は 4 段で、デモのコードは 5 段。</text>
  <text x="632" y="498" font-size="13" fill="#6b7280">動くコードなので、正解が 1 つに決まらない。</text>

  <text x="600" y="552" text-anchor="middle" font-size="16" fill="#374151">OFF なのは「間違ったルール」だからではなく、<tspan font-weight="700" fill="#111827">有効にするかどうかがチームの判断だから</tspan>。</text>
</svg>
