<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <defs>
    <style>.m{font-family:'SFMono-Regular',Menlo,Consolas,monospace}</style>
    <filter id="sh5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0b1220" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>

  <text x="600" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">リポジトリで配れるもの、配れないもの</text>
  <text x="600" y="86" text-anchor="middle" font-size="17" fill="#6b7280">プロジェクトの識別情報はコミットして共有できる。トークンだけは各自がサーバーから発行する。</text>

  <!-- ===== left panel ===== -->
  <g filter="url(#sh5)"><rect x="60" y="136" width="500" height="390" rx="14" fill="#ffffff" stroke="#dfe3e8"/></g>
  <path d="M60 150 a14 14 0 0 1 14 -14 h472 a14 14 0 0 1 14 14 v28 h-500 z" fill="#f4f6f8"/>
  <line x1="60" y1="178" x2="560" y2="178" stroke="#dfe3e8"/>
  <text x="310" y="164" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">リポジトリにコミットして共有する</text>

  <rect x="90" y="200" width="440" height="46" rx="8" fill="#fafbfc" stroke="#e2e6ea"/>
  <text x="110" y="229" font-size="15" font-weight="700" fill="#111827" class="m">.sonarlint/connectedMode.json</text>

  <rect x="90" y="262" width="440" height="46" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="110" y="291" font-size="14" fill="#166534" class="m">sonarCloudOrganization</text>
  <text x="510" y="291" text-anchor="end" font-size="13" fill="#15803d">組織キー</text>

  <rect x="90" y="318" width="440" height="46" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="110" y="347" font-size="14" fill="#166534" class="m">projectKey</text>
  <text x="510" y="347" text-anchor="end" font-size="13" fill="#15803d">プロジェクトキー</text>

  <rect x="90" y="374" width="440" height="46" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="110" y="403" font-size="14" fill="#166534" class="m">region</text>
  <text x="510" y="403" text-anchor="end" font-size="13" fill="#15803d">EU / US</text>

  <text x="90" y="454" font-size="14" font-weight="700" fill="#374151">クローンした人の IDE に、自動でバインド提案の通知が出る</text>
  <text x="90" y="480" font-size="13" fill="#6b7280">プロジェクトを探して選ぶ工程が丸ごと消える</text>

  <text x="600" y="352" text-anchor="middle" font-size="34" fill="#9ca3af">＋</text>

  <!-- ===== right panel ===== -->
  <g filter="url(#sh5)"><rect x="640" y="136" width="500" height="390" rx="14" fill="#ffffff" stroke="#dfe3e8"/></g>
  <path d="M640 150 a14 14 0 0 1 14 -14 h472 a14 14 0 0 1 14 14 v28 h-500 z" fill="#f4f6f8"/>
  <line x1="640" y1="178" x2="1140" y2="178" stroke="#dfe3e8"/>
  <text x="890" y="164" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">各自が自分で用意する</text>

  <rect x="670" y="200" width="440" height="88" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="690" y="234" font-size="15" font-weight="700" fill="#991b1b">ユーザートークン</text>
  <text x="690" y="262" font-size="13" fill="#b91c1c">リポジトリに入れてはいけない</text>
  <text x="1086" y="252" text-anchor="end" font-size="34" fill="#ef4444">✕</text>

  <rect x="670" y="310" width="440" height="82" rx="8" fill="#fafbfc" stroke="#e2e6ea"/>
  <text x="690" y="338" font-size="13" fill="#374151">入れてしまうと、リポジトリを読める全員が</text>
  <text x="690" y="362" font-size="13" fill="#374151">そのユーザーとしてサーバーを操作できてしまう</text>

  <rect x="670" y="414" width="440" height="82" rx="8" fill="#eef4ff" stroke="#93b4f5"/>
  <text x="690" y="443" font-size="14" font-weight="700" fill="#1e3a8a">Generate Token</text>
  <text x="690" y="470" font-size="13" fill="#3b5bdb">通知から開く設定画面で、その場で発行できる</text>

  <!-- ===== footer ===== -->
  <rect x="60" y="548" width="1080" height="60" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="600" y="578" text-anchor="middle" font-size="15" font-weight="700" fill="#374151">サーバーから開発者の端末へ情報を送りつける経路は存在しない。</text>
  <text x="600" y="598" text-anchor="middle" font-size="13" fill="#6b7280">だから「どのプロジェクトか」という手がかりは、リポジトリに入れて運ぶしかない。</text>
</svg>
