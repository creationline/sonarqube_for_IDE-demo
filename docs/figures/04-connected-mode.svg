<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <defs>
    <style>.m{font-family:'SFMono-Regular',Menlo,Consolas,monospace}</style>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0b1220" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="580" fill="#ffffff"/>

  <text x="600" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">サーバーから降りてくるのは「ルール設定」だけ</text>
  <text x="600" y="86" text-anchor="middle" font-size="17" fill="#6b7280">解析そのものは手元の IDE で走っている。だから push しなくても、バインドした瞬間に件数が増える。</text>

  <!-- ===== left box: local ===== -->
  <g filter="url(#sh2)"><rect x="60" y="150" width="380" height="320" rx="14" fill="#ffffff" stroke="#dfe3e8"/></g>
  <path d="M60 164 a14 14 0 0 1 14 -14 h352 a14 14 0 0 1 14 14 v28 h-380 z" fill="#f4f6f8"/>
  <line x1="60" y1="192" x2="440" y2="192" stroke="#dfe3e8"/>
  <text x="250" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">あなたの PC ／ VS Code</text>

  <rect x="90" y="214" width="320" height="52" rx="8" fill="#fafbfc" stroke="#e2e6ea"/>
  <text x="110" y="238" font-size="14" font-weight="700" fill="#111827" class="m">user_manager.py</text>
  <text x="110" y="256" font-size="12" fill="#6b7280">いま開いているファイル</text>

  <path d="M244 270 h12 v8 h8 l-14 16 -14 -16 h8 z" fill="#9aa3ad"/>

  <rect x="90" y="300" width="320" height="66" rx="8" fill="#eef4ff" stroke="#93b4f5"/>
  <text x="110" y="326" font-size="15" font-weight="700" fill="#1e3a8a">SonarQube for IDE</text>
  <text x="110" y="350" font-size="13" fill="#3b5bdb">解析エンジンはここで動く（ローカル実行）</text>

  <path d="M244 370 h12 v8 h8 l-14 16 -14 -16 h8 z" fill="#9aa3ad"/>

  <rect x="90" y="400" width="320" height="52" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="110" y="432" font-size="15" font-weight="700" fill="#166534">Problems タブに指摘が出る</text>

  <!-- ===== right box: server ===== -->
  <g filter="url(#sh2)"><rect x="760" y="150" width="380" height="320" rx="14" fill="#ffffff" stroke="#dfe3e8"/></g>
  <path d="M760 164 a14 14 0 0 1 14 -14 h352 a14 14 0 0 1 14 14 v28 h-380 z" fill="#f4f6f8"/>
  <line x1="760" y1="192" x2="1140" y2="192" stroke="#dfe3e8"/>
  <text x="950" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">SonarQube Cloud ／ Server</text>

  <rect x="790" y="214" width="320" height="52" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="810" y="238" font-size="15" font-weight="700" fill="#5b21b6">品質プロファイル「Team way」</text>
  <text x="810" y="256" font-size="12" fill="#7c6ba8">チームで一元管理する、有効ルールの一覧</text>

  <g font-size="13">
    <text x="812" y="300" fill="#16a34a" font-weight="700">✓</text><text x="834" y="300" fill="#374151">Sonar way の 398 ルール</text>
    <text x="812" y="330" fill="#16a34a" font-weight="700">✓</text><text x="834" y="330" fill="#374151" class="m">python:S5042</text><text x="960" y="330" fill="#b45309" font-weight="700">← 追加した</text>
    <text x="812" y="360" fill="#16a34a" font-weight="700">✓</text><text x="834" y="360" fill="#374151" class="m">python:S134</text><text x="960" y="360" fill="#b45309" font-weight="700">← 追加した</text>
  </g>

  <rect x="790" y="386" width="320" height="66" rx="8" fill="#fafbfc" stroke="#e2e6ea"/>
  <text x="810" y="411" font-size="13" fill="#6b7280">ここを 1 回直せば、バインドしている</text>
  <text x="810" y="433" font-size="13" fill="#6b7280">全員の IDE に同じ基準が行き渡る</text>

  <!-- ===== arrow 1: server -> IDE ===== -->
  <text x="600" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#2f6feb">品質プロファイル（設定だけ）</text>
  <text x="600" y="242" text-anchor="middle" font-size="13" fill="#6b7280">＝ どのルールを ON にするか</text>
  <g fill="#2f6feb">
    <rect x="470" y="256" width="285" height="12"/>
    <path d="M470 244 L440 262 L470 280 Z"/>
  </g>

  <!-- ===== arrow 2: source code does NOT go out ===== -->
  <g fill="#c3c9d0">
    <rect x="445" y="352" width="285" height="10"/>
    <path d="M730 341 L760 357 L730 373 Z"/>
  </g>
  <g stroke="#dc2626" stroke-width="6" stroke-linecap="round">
    <line x1="573" y1="335" x2="613" y2="379"/>
    <line x1="613" y1="335" x2="573" y2="379"/>
  </g>
  <text x="600" y="406" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">ソースコードは送らない</text>
  <text x="600" y="428" text-anchor="middle" font-size="13" fill="#6b7280">push もサーバー側の解析も不要</text>

  <text x="600" y="536" text-anchor="middle" font-size="17" fill="#374151">つまり <tspan font-weight="700" fill="#111827">「バインドした瞬間に、その場で 2 件増える」</tspan></text>
</svg>
