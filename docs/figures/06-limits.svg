<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <defs><style>.m{font-family:'SFMono-Regular',Menlo,Consolas,monospace}</style></defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="54" text-anchor="middle" font-size="32" font-weight="700" fill="#111827">IDE だけで 5 件すべてに届く ——分かれ目は 1 本だけ</text>
  <text x="600" y="88" text-anchor="middle" font-size="17" fill="#6b7280">同じリポジトリに仕込んだ 5 つの問題が、「ルール表が手元に届いているか」で 2 段に分かれる</text>

  <!-- ============ 第 1 段 ============ -->
  <rect x="60" y="116" width="1080" height="158" rx="12" fill="#fff5f5" stroke="#fbcaca"/>
  <rect x="60" y="116" width="6" height="158" rx="3" fill="#dc2626"/>
  <rect x="90" y="136" width="72" height="24" rx="12" fill="#dc2626"/>
  <text x="126" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">第 1 段</text>
  <rect x="170" y="136" width="149" height="24" rx="12" fill="#eef2ff"/>
  <text x="184" y="153" font-size="12.5" font-weight="700" fill="#4338ca">設定ゼロ・その場で判定</text>
  <text x="90" y="192" font-size="23" font-weight="700" fill="#111827">拡張機能を入れるだけ</text>
  <text x="90" y="222" font-size="14.5" fill="#6b7280">VS Code に入れてファイルを開く。アカウントもサーバーも要らない</text>
  <text x="90" y="246" font-size="14.5" fill="#6b7280">解析エンジンとルール表は、拡張機能に同梱されている</text>
  <line x1="600" y1="140" x2="600" y2="254" stroke="#fbcaca"/>
  <rect x="632" y="140" width="300" height="30" rx="8" fill="#ffffff" stroke="#fbcaca"/>
  <text x="650" y="162" font-size="15" fill="#111827">① API キーのハードコード</text>
  <text x="920" y="161" text-anchor="end" font-size="11.5" fill="#9aa3ad" class="m">S6418</text>
  <rect x="632" y="178" width="300" height="30" rx="8" fill="#ffffff" stroke="#fbcaca"/>
  <text x="650" y="200" font-size="15" fill="#111827">② パスワードのハードコード</text>
  <text x="920" y="199" text-anchor="end" font-size="11.5" fill="#9aa3ad" class="m">S2068</text>
  <rect x="632" y="216" width="300" height="38" rx="8" fill="#ffffff" stroke="#fbcaca"/>
  <text x="650" y="235" font-size="15" fill="#111827">③ 常に成功する assert</text>
  <text x="920" y="234" text-anchor="end" font-size="11.5" fill="#9aa3ad" class="m">S5905</text>
  <text x="650" y="250" font-size="11.5" fill="#6b7280">テストコード内。scope が All のルール</text>
  <circle cx="1058" cy="195" r="44" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="1058" y="191" text-anchor="middle" font-size="36" font-weight="700" fill="#dc2626">3</text>
  <text x="1058" y="213" text-anchor="middle" font-size="13" fill="#dc2626">件</text>

  <!-- ============ 唯一の分かれ目 ============ -->
  <line x1="60" y1="310" x2="1140" y2="310" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="9 6"/>
  <rect x="290" y="291" width="620" height="38" rx="19" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="600" y="315" text-anchor="middle" font-size="15.5" font-weight="700" fill="#16a34a">分かれ目は 1 本 ── ルール表が届いているか。設定が届けば、手元のままで越えられる</text>

  <!-- ============ 第 2 段 ============ -->
  <rect x="60" y="346" width="1080" height="146" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
  <rect x="60" y="346" width="6" height="146" rx="3" fill="#d97706"/>
  <rect x="90" y="366" width="72" height="24" rx="12" fill="#d97706"/>
  <text x="126" y="383" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">第 2 段</text>
  <rect x="170" y="366" width="149" height="24" rx="12" fill="#eef2ff"/>
  <text x="184" y="383" font-size="12.5" font-weight="700" fill="#4338ca">ルール表が下りてくる</text>
  <rect x="327" y="366" width="90" height="24" rx="12" fill="#eef2ff"/>
  <text x="341" y="383" font-size="12.5" font-weight="700" fill="#4338ca">push 不要</text>
  <text x="90" y="422" font-size="23" font-weight="700" fill="#111827">＋ サーバーに繋いでバインド</text>
  <text x="90" y="452" font-size="14.5" fill="#6b7280">下りてくるのはルール設定だけ。解析は手元で走り続ける</text>
  <text x="90" y="476" font-size="14.5" fill="#6b7280">④⑤ を判定するルールは、最初から手元にあった（既定で OFF）</text>
  <line x1="600" y1="370" x2="600" y2="472" stroke="#fcd34d"/>
  <rect x="632" y="386" width="300" height="30" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="650" y="408" font-size="15" fill="#111827">④ ZIP の無制限展開</text>
  <text x="920" y="407" text-anchor="end" font-size="11.5" fill="#9aa3ad" class="m">S5042</text>
  <rect x="632" y="424" width="300" height="30" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="650" y="446" font-size="15" fill="#111827">⑤ 深すぎるネスト</text>
  <text x="920" y="445" text-anchor="end" font-size="11.5" fill="#9aa3ad" class="m">S134</text>
  <circle cx="1058" cy="419" r="44" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
  <text x="1058" y="415" text-anchor="middle" font-size="36" font-weight="700" fill="#d97706">5</text>
  <text x="1058" y="437" text-anchor="middle" font-size="13" fill="#d97706">件</text>

  <!-- ============ 結び ============ -->
  <line x1="40" y1="538" x2="1160" y2="538" stroke="#eceff2"/>
  <text x="600" y="578" text-anchor="middle" font-size="17" fill="#374151">2 つの段で、<tspan font-weight="700" fill="#111827">エンジンも・見ている範囲も・応答の速さも同じ</tspan>。変わるのはルール表だけ。</text>
  <text x="600" y="608" text-anchor="middle" font-size="17" fill="#374151">Python アナライザには 435 ルールが同梱され、既定は <tspan font-weight="700" fill="#166534">398 が ON</tspan> ／ <tspan font-weight="700" fill="#b45309">37 が OFF</tspan>。</text>
  <text x="600" y="638" text-anchor="middle" font-size="17" fill="#374151">OFF は「間違ったルール」ではなく、<tspan font-weight="700" fill="#111827">有効にするかどうかがチームの判断に属する</tspan>もの。</text>
  <text x="600" y="674" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">段を上げて増えるのは「エンジンの能力」ではなく、「どのルールが ON になっているか」。</text>
</svg>
